services:
  db:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local}/tp1-db:${IMAGE_TAG:-prod}
    restart: unless-stopped

  mailer:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local}/tp1-mailer:${IMAGE_TAG:-prod}
    restart: unless-stopped

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local}/tp1-api:${IMAGE_TAG:-prod}
    build:
      target: prod
    restart: unless-stopped

  front:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local}/tp1-front:${IMAGE_TAG:-prod}
    build:
      target: prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy

networks:
  # Coupe le NAT sortant : db et mailer n'ont aucune route vers l'exterieur.
  # L'API garde la sienne, elle est aussi sur edge.
  internal:
    internal: true
